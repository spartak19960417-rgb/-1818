name: Build Vasilisa APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: unzip -q Vasilisa_Arena_clean_v1.zip -d unpacked

      - name: Build APK
        working-directory: unpacked/vas2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vasilisa-debug-apk
          path: unpacked/vas2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
